<body>
<div id="root"></div>
<div id="printArea"></div>
<script>
// ===== Data Layer (repository over localStorage — สลับ Supabase ได้ภายหลัง) =====
// (SEED_UNITS ถูกลบ — ข้อมูลจริงอยู่บนคลาวด์ ไม่ฝังในไฟล์อีกต่อไป)
document.documentElement.dataset.theme=localStorage.getItem('rentalapp_theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
// ---- Supabase (เฟส 2: ข้อมูลกลางบนคลาวด์ — publishable key ปลอดภัยเพราะมี RLS + ต้องล็อกอิน) ----
const SUPA_URL='https://erpsngalvdewkiwdlvvz.supabase.co';
const SUPA_KEY='sb_publishable_7dLWHeCYh5yV8vUuS55LBQ_lFb-G57W';
const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const DB_KEY='rentalapp_db_v1'; // localStorage = สำเนาฉุกเฉินในเครื่องเท่านั้น (แหล่งความจริงคือคลาวด์)
const TABLES=['properties','units','tenants','contracts','deposits','rate_settings','meter_readings','bills','payments','expenses','staff','files','ledger'];
const KV_KEYS=['_seq','_imp_onnut','_imp_mak','_seed_props5'];
function blankDB(){const d={_seq:0};TABLES.forEach(t=>d[t]=[]);return d}
let _db=null;
function loadDB(){return _db}
async function fetchAllRows(t){let out=[],from=0;const page=1000;
 for(;;){const r=await supa.from(t).select('id,data').range(from,from+page-1);
  if(r.error)throw new Error(t+': '+r.error.message);
  out=out.concat(r.data.map(x=>x.data));if(r.data.length<page)break;from+=page}
 return out}
async function fetchDB(){
 const d=blankDB();
 const all=await Promise.all(TABLES.map(fetchAllRows));
 TABLES.forEach((t,i)=>d[t]=all[i]);
 const kv=await supa.from('kv').select('key,value');
 if(kv.error)throw new Error('kv: '+kv.error.message);
 kv.data.forEach(r=>{d[r.key]=r.value});
 if(typeof d._seq!=='number')d._seq=0;
 return d}
// ---- บันทึกขึ้นคลาวด์อัตโนมัติแบบส่วนต่าง (ส่งเฉพาะแถวที่เปลี่ยน) ----
let _snap={},_kvSnap={},_syncTimer=null,_syncing=false,_dirtyAgain=false;
const SYNC={state:'idle'};
function setSync(s){SYNC.state=s;window.dispatchEvent(new CustomEvent('syncstate'))}
function takeSnap(){_snap={};TABLES.forEach(t=>{const m={};_db[t].forEach(r=>m[String(r.id)]=JSON.stringify(r));_snap[t]=m});
 _kvSnap={};KV_KEYS.forEach(k=>_kvSnap[k]=JSON.stringify(_db[k]===undefined?null:_db[k]))}
async function syncNow(){
 if(_syncing){_dirtyAgain=true;return}
 _syncing=true;setSync('saving');
 try{
  for(const t of TABLES){
   const old=_snap[t]||{},cur={},ups=[];
   _db[t].forEach(r=>{const k=String(r.id),s=JSON.stringify(r);cur[k]=s;if(old[k]!==s)ups.push({id:k,data:r})});
   const dels=Object.keys(old).filter(k=>!(k in cur));
   if(ups.length){const r=await supa.from(t).upsert(ups);if(r.error)throw new Error(t+': '+r.error.message)}
   if(dels.length){const r=await supa.from(t).delete().in('id',dels);if(r.error)throw new Error(t+': '+r.error.message)}
   _snap[t]=cur}
  const kvUps=[];
  KV_KEYS.forEach(k=>{const s=JSON.stringify(_db[k]===undefined?null:_db[k]);
   if(_kvSnap[k]!==s){kvUps.push({key:k,value:_db[k]===undefined?null:_db[k]});_kvSnap[k]=s}});
  if(kvUps.length){const r=await supa.from('kv').upsert(kvUps);if(r.error)throw new Error('kv: '+r.error.message)}
  setSync('ok');
 }catch(e){console.error('sync error',e);setSync('error')}
 finally{_syncing=false;if(_dirtyAgain){_dirtyAgain=false;syncNow()}}
}

function calcBill({rent,service,svcX=0,trash=0,othF=0,disc=0,wUnits,eUnits,rates,contractType,internet=0,area=0,other=0}){
 const R=rates;
 const minW=(R.waterMinBaht!=null)?R.waterMinBaht:(R.waterMinUnits||0)*R.waterRate; // ขั้นต่ำน้ำเป็นบาท: ไตรพร 42 / มักกะสัน 45 / อ่อนนุช 50
 const H=Math.max(wUnits*R.waterRate, minW);
 const I=H*(R.riskPct||0)/100, J=H*(R.profitPct||0)/100;
 const K=contractType==='sor'?(R.waterFeeNew||0):(R.waterFeeOld||0);
 const L=eUnits*R.elecRate, M=L*(R.riskPct||0)/100, N=L*(R.profitPct||0)/100;
 const O=contractType==='sor'?(R.elecFeeNew||0):(R.elecFeeOld||0);
 const cf=(R.customFees||[]).filter(x=>x.name&&+x.amount).map(x=>({name:x.name,amount:+x.amount}));
 const cfSum=cf.reduce((s,x)=>s+x.amount,0);
 const total=Math.floor(rent+service+svcX+trash+othF+disc+H+I+J+K+L+M+N+O+internet+area+other+cfSum); // ปัดเศษทิ้ง
 return{rent,service,svcX,trash,othF,disc,wH:H,wI:I,wJ:J,wK:K,eL:L,eM:M,eN:N,eO:O,internet,area,other,cf,cfSum,total};
}

    <input type="number" placeholder="บาท" style={{maxWidth:110}} value={x.amount}

    <button className="btn sm red" onClick={()=>{const a=(rt.customFees||[]).filter((_,j)=>j!==i);setRt({...rt,customFees:a})}}>✕</button>
   </div>)}

    <button className="btn" onClick={()=>go('meters')}>⚡ จดมิเตอร์</button>

    <button className="btn" onClick={()=>go('summary')}>📋 สรุปเดือน</button>
   </div></div>
  <div className="card"><h2>เขตอันตราย</h2>
   {us.length===0
    ?<div className="mut" style={{marginBottom:8}}>อาคารนี้ไม่มีห้องเช่าในระบบ ลบได้ทันที</div>
    :<div className="mut" style={{marginBottom:8}}>อาคารนี้มี {us.length} ห้อง — การลบจะพาข้อมูลข้างในไปทั้งหมด (ห้อง/บิล/สัญญา/มิเตอร์/รายจ่าย) แนะนำกด "ส่งออกข้อมูล" ในหน้าตั้งค่าเก็บ backup ก่อน</div>}
   <button className="btn red" onClick={()=>{
    if(Repo.list('properties').length<=1){alert('ต้องมีทรัพย์สินอย่างน้อย 1 แห่ง');return}
    const uids=new Set(us.map(u=>u.id));
    const bs=Repo.list('bills',b=>uids.has(b.unitId));
    const cs=Repo.list('contracts',c=>uids.has(c.unitId));
    const exps=Repo.list('expenses',x=>x.propertyId===p.id);
    if(us.length>0){
     if(!confirm('จะลบ "'+p.name+'" พร้อมข้อมูลทั้งหมด:\n· '+us.length+' ห้อง\n· '+bs.length+' บิล\n· '+cs.length+' สัญญา (+มัดจำ/ประกัน)\n· มิเตอร์และรายจ่ายทั้งหมดของอาคารนี้\n\nย้อนกลับไม่ได้! ดำเนินการต่อ?'))return;
     const typed=prompt('เพื่อยืนยัน พิมพ์ชื่ออาคารให้ตรง:\n'+p.name);
     if(typed!==p.name){alert('ชื่อไม่ตรง — ยกเลิกการลบ');return}
    }else{
     if(!confirm('ลบ "'+p.name+'" ถาวร? ย้อนกลับไม่ได้'))return;
    }
    const bids=new Set(bs.map(b=>b.id));
    Repo.list('payments',x=>bids.has(x.billId)).forEach(x=>Repo.remove('payments',x.id));
    bs.forEach(b=>Repo.remove('bills',b.id));
    Repo.list('meter_readings',x=>uids.has(x.unitId)).forEach(x=>Repo.remove('meter_readings',x.id));
    const cids=new Set(cs.map(c=>c.id));
    Repo.list('deposits',d=>cids.has(d.contractId)).forEach(d=>Repo.remove('deposits',d.id));
    Repo.list('files',x=>cids.has(x.contractId)).forEach(x=>Repo.remove('files',x.id));
    const tids=[...new Set(cs.map(c=>c.tenantId).filter(Boolean))];
    cs.forEach(c=>Repo.remove('contracts',c.id));
    tids.forEach(t=>{if(Repo.list('contracts',c=>c.tenantId===t).length===0)Repo.remove('tenants',t)});
    exps.forEach(x=>Repo.remove('expenses',x.id));
    us.forEach(u=>Repo.remove('units',u.id));
    Repo.list('rate_settings',x=>x.propertyId===p.id).forEach(x=>Repo.remove('rate_settings',x.id));
    Repo.remove('properties',p.id);
    setCurPid(Repo.list('properties')[0].id);go('home');refresh();
   }}>🗑 ลบทรัพย์สินนี้{us.length>0?' (พร้อมข้อมูลทั้งหมดข้างใน)':''}</button>
  </div>
  {pm&&<PropertyModal key={pm.id} init={pm} onClose={()=>setPm(null)} refresh={refresh}/>}
 </div>;
}
function Home({refresh,go}){
 const [pm,setPm]=useState(null);
 const m=nowMonth();
 const props=Repo.list('properties');
 const info=p=>{
  const us=Repo.list('units',u=>u.propertyId===p.id);
  const uset=new Set(us.map(u=>u.id));
  const unpaidBills=Repo.list('bills',b=>b.status==='ค้างชำระ'&&uset.has(b.unitId));
  const payments=Repo.list('payments',x=>x.date&&x.date.slice(0,7)===m&&uset.has((Repo.get('bills',x.billId)||{}).unitId));
  const collected=payments.reduce((s,x)=>s+x.amount,0);
  const expense=Repo.list('expenses',x=>x.propertyId===p.id&&x.date&&x.date.slice(0,7)===m).reduce((s,x)=>s+x.amount,0);
  return {units:us.length,occ:us.filter(u=>isOccupied(u.id)).length,
   unpaidRooms:new Set(unpaidBills.map(b=>b.unitId)).size,
   unpaidSum:unpaidBills.reduce((s,b)=>s+b.total,0),
   collected,expense,profit:collected-expense};
 };
 const apts=props.filter(p=>p.type==='อพาร์ทเม้นท์'||p.type==='หอพัก');
 const blds=props.filter(p=>p.type==='เช่าอาคาร');
 const signs=props.filter(p=>p.type==='เช่าป้าย');
 const others=props.filter(p=>!apts.includes(p)&&!blds.includes(p)&&!signs.includes(p));
 const rows=apts.map(p=>({p,...info(p)}));
 const tot=k=>rows.reduce((s,r)=>s+r[k],0);
 const z=v=>v===0?'-':v;
 const zm=v=>v===0?'-':fmt(v);

 const money=(v,c)=><td className="r" style={v!==0&&c?{color:c,fontWeight:600}:{}}>{zm(v)}</td>;
 const profitStyle=v=>v<0?{color:'var(--red)',fontWeight:700}:v>0?{color:'var(--ok)',fontWeight:700}:{};
 const simpleTable=list=>list.length===0
  ?<div className="card mut" style={{padding:'10px 16px'}}>— ยังไม่มี (เตรียมหมวดไว้แล้ว) —</div>
  :<div className="card" style={{padding:'8px 12px'}}><div className="scrollx"><table className="t">
   <thead><tr><th>ชื่อ</th><th className="r">หน่วยเช่า</th><th>สถานะ</th></tr></thead>
   <tbody>{list.map(p=>{const n=Repo.list('units',u=>u.propertyId===p.id).length;
    return <tr key={p.id} className="tap" onClick={()=>{setCurPid(p.id);go('prop')}}>
     <td><span className="plink"><span className="pdot" style={{background:p.color||'#14614a'}}/>{propIcon(p.type)} {p.shortName||p.name}</span></td>
     <td className="r">{n===0?'-':n}</td><td className="mut">{p.note||'-'}</td></tr>})}
   </tbody></table></div></div>;
 return <div>
  <div className="cath">🏢 อพาร์ทเมนท์ ({apts.length}) — เดือน {monthTHfull(m)}</div>
  <div className="card" style={{padding:'8px 12px'}}><div className="scrollx"><table className="t">
   <thead><tr><th>อาคาร</th><th className="r">ห้อง</th><th className="r">เช่า/ว่าง</th>
    <th className="r">จ่าย/ค้าง</th><th className="r">รายรับ</th><th className="r">รายจ่าย</th><th className="r">กำไร</th><th className="r">ลูกหนี้</th></tr></thead>
   <tbody>
    {rows.map(r=>{const p=r.p;
     return <tr key={p.id} className="tap" onClick={()=>{setCurPid(p.id);go('prop')}}>
      <td><span className="plink"><span className="pdot" style={{background:p.color||'#14614a'}}/>{p.shortName||p.name}</span>{p.note?<div className="mut">{p.note}</div>:null}</td>
      <td className="r">{z(r.units)}</td>
      <td className="r"><span style={r.occ>0?{color:'var(--ok)',fontWeight:700}:{}}>{z(r.occ)}</span><span className="mut">/</span><span style={r.units-r.occ>0?{color:'var(--red)',fontWeight:700}:{}}>{z(r.units-r.occ)}</span></td>
      <td className="r"><span style={Math.max(r.occ-r.unpaidRooms,0)>0?{color:'var(--ok)',fontWeight:700}:{}}>{z(Math.max(r.occ-r.unpaidRooms,0))}</span><span className="mut">/</span><span style={r.unpaidRooms>0?{color:'var(--red)',fontWeight:700}:{}}>{z(r.unpaidRooms)}</span></td>
      {money(r.collected,'var(--ok)')}{money(r.expense,'var(--red)')}
      <td className="r" style={profitStyle(r.profit)}>{zm(r.profit)}</td>
      <td className="r" style={r.unpaidSum>0?{color:'var(--red)'}:{}}>{zm(r.unpaidSum)}</td></tr>})}
    <tr className="sumrow">
     <td>รวม</td><td className="r">{z(tot('units'))}</td>
     <td className="r"><span style={tot('occ')>0?{color:'var(--ok)'}:{}}>{z(tot('occ'))}</span><span className="mut">/</span><span style={tot('units')-tot('occ')>0?{color:'var(--red)'}:{}}>{z(tot('units')-tot('occ'))}</span></td>
     <td className="r"><span style={Math.max(tot('occ')-tot('unpaidRooms'),0)>0?{color:'var(--ok)'}:{}}>{z(Math.max(tot('occ')-tot('unpaidRooms'),0))}</span><span className="mut">/</span><span style={tot('unpaidRooms')>0?{color:'var(--red)'}:{}}>{z(tot('unpaidRooms'))}</span></td>
     <td className="r" style={tot('collected')>0?{color:'var(--ok)'}:{}}>{zm(tot('collected'))}</td>
     <td className="r" style={tot('expense')>0?{color:'var(--red)'}:{}}>{zm(tot('expense'))}</td>
     <td className="r" style={profitStyle(tot('profit'))}>{zm(tot('profit'))}</td>
     <td className="r" style={tot('unpaidSum')>0?{color:'var(--red)'}:{}}>{zm(tot('unpaidSum'))}</td></tr>
   </tbody></table></div>
  </div>
  <div className="cath">🏬 อาคาร ({blds.length})</div>
  {simpleTable(blds)}
  <div className="cath">🪧 ป้าย ({signs.length})</div>
  {simpleTable(signs)}
  <div className="cath">📦 อื่น ๆ ({others.length})</div>
  {simpleTable(others)}
  <div style={{margin:'4px 0 14px'}}><button className="btn" onClick={()=>setPm({})}>＋ เพิ่มทรัพย์สิน</button></div>
  {pm&&<PropertyModal key={pm.id||'new'} init={pm} onClose={()=>setPm(null)} refresh={refresh}/>}
 </div>;
}

  }
  delete rest._amenOther;
  if(id){const cc=activeContract(id);if(cc){rest.rent=cc.rent;rest.service=cc.service}}rest.areaFee=+rest.areaFee||0;rest.internet=+rest.internet||0;rest.serviceExtra=+rest.serviceExtra||0;rest.trash=+rest.trash||0;rest.otherFee=+rest.otherFee||0;rest.discount=+rest.discount||0;
  id?Repo.update('units',id,rest):Repo.create('units',{...rest,propertyId:curPid(),hasWaterMeter:true,hasElecMeter:true,amenities:edit.amenities||[]});
  setEdit(null);refresh()};
 return <div>

// ===== โมดัลดูห้อง (ใช้ร่วมหน้าห้อง/หน้าผู้เช่า) =====
function RoomViewModal({unit,onClose,onEdit}){
 const u=Repo.get('units',unit.id)||unit;const c=activeContract(u.id);
 const [tab,setTab]=useState('info');
 const [histLim,setHistLim]=useState(0); // 0 = แสดงทุกเดือนที่มี
 // ประวัติรายเดือนของห้อง: บิลทุกใบ (ใหม่→เก่า)
 const histAll=useMemo(()=>Repo.list('bills',b=>b.unitId===u.id).sort((a,b)=>a.rentMonth<b.rentMonth?1:-1),[u.id]);
 const hist=histLim?histAll.slice(0,histLim):histAll;
 const tenantOf=b=>{
  if(b.tenantId)return tenantName(b.tenantId);
  const mS=b.rentMonth+'-01',mE=b.rentMonth+'-31';
  const ct=Repo.list('contracts',x=>x.unitId===u.id&&x.start&&x.start<=mE&&(!x.end||x.end>=mS))[0];
  return ct?tenantName(ct.tenantId):'-';
 };
 const avg=k=>{const v=hist.map(b=>+b[k]||0);return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length*10)/10:0};
 const R=({l,v})=><div className="step" style={{padding:'6px 0'}}><div style={{minWidth:140}} className="mut">{l}</div><div style={{flex:1}}><b>{v===0||v===''||v==null?'-':v}</b></div></div>;
 return <Modal title={'🚪 ห้อง '+u.code} onClose={onClose}>
  <div className="row" style={{gap:6,marginBottom:10}}>
   <button className={'btn sm'+(tab==='info'?'':' line')} onClick={()=>setTab('info')}>ข้อมูลห้อง</button>
   <button className={'btn sm'+(tab==='hist'?'':' line')} onClick={()=>setTab('hist')}>📊 ประวัติ</button>
  </div>
  {tab==='info'&&<div>
  <R l="ผู้เช่า" v={c?tenantName(c.tenantId):'ไม่มีผู้เช่า (ว่าง)'}/>
  {c&&<R l="สัญญาเริ่ม" v={c.start?dateTH(c.start):'-'}/>}
  <R l={'ค่าเช่า'+(c?' 🔒 ตามสัญญา':' (ตั้งต้น)')} v={fmt(c?c.rent:u.rent)+' บาท/เดือน'}/>
  <R l="ค่าบริการ" v={fmt(c?c.service:u.service)+' บาท/เดือน'}/>
  <R l="ค่าบริการเสริม" v={u.serviceExtra?fmt(u.serviceExtra):0}/>
  <R l="ค่าขยะ" v={u.trash?fmt(u.trash):0}/>
  <R l="ค่าอื่นๆ รายเดือน" v={u.otherFee?fmt(u.otherFee):0}/>
  <R l="ส่วนลด" v={u.discount?fmt(u.discount):0}/>
  <R l="ค่าขอใช้พื้นที่" v={u.areaFee?fmt(u.areaFee):0}/>
  <R l="อินเทอร์เน็ต" v={u.internet?fmt(u.internet):0}/>
  <R l="รูปแบบสัญญา" v={u.contractType==='sor'?'สัญญาควบคุม สคบ.':'สัญญาเก่า'}/>
  <div className="step" style={{padding:'6px 0'}}><div style={{minWidth:140}} className="mut">เฟอร์นิเจอร์ในห้อง</div>
   <div style={{flex:1,display:'flex',flexWrap:'wrap',gap:5}}>
    {STD_AMEN.map(a=>{const has=(u.amenities||[]).includes(a);
     return <span key={a} className={'tag '+(has?'g':'b')}>{(has?'✓ ':'– ')+a}</span>})}
    {(u.amenities||[]).filter(x=>!STD_AMEN.includes(x)).map(x=><span key={x} className="tag g">✓ {x}</span>)}
   </div></div>
  <R l="หมายเหตุ" v={u.note}/>
  </div>}
  {tab==='hist'&&(hist.length===0
   ?<div className="mut" style={{padding:'14px 0'}}>ยังไม่มีบิลของห้องนี้ — ประวัติจะแสดงเมื่อออกบิลเดือนแรก</div>
   :<div style={{overflowX:'auto'}}>
    <div className="row" style={{justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
     <span className="mut">มีข้อมูล {histAll.length} เดือน{histLim&&histLim<histAll.length?' · แสดง '+hist.length:''}</span>
     <label className="mut" style={{display:'flex',alignItems:'center',gap:6}}>ดูย้อนหลัง
      <select value={histLim} onChange={e=>setHistLim(+e.target.value)}>
       <option value={0}>ทั้งหมด</option><option value={3}>3 เดือน</option><option value={6}>6 เดือน</option>
       <option value={12}>12 เดือน</option><option value={24}>24 เดือน</option>
      </select></label>
    </div>
    <table className="t"><thead><tr>
     <th>เดือน</th><th>ผู้เช่า</th><th style={{textAlign:'right'}}>ค่าเช่า</th>
     <th style={{textAlign:'right'}}>น้ำ (หน่วย)</th><th style={{textAlign:'right'}}>ไฟ (หน่วย)</th>
     <th style={{textAlign:'right'}}>รวมบิล</th><th>สถานะ</th>
    </tr></thead><tbody>
    {hist.map(b=><tr key={b.id}>
     <td>{monthTH(b.rentMonth)}</td>
     <td>{tenantOf(b)}</td>
     <td style={{textAlign:'right'}}>{fmt(b.items?b.items.rent:0)}</td>
     <td style={{textAlign:'right'}}>{b.wUnits==null?'-':fmt(b.wUnits)}</td>
     <td style={{textAlign:'right'}}>{b.eUnits==null?'-':fmt(b.eUnits)}</td>
     <td style={{textAlign:'right'}}><b>{fmt(b.total)}</b></td>
     <td>{statusTag(b.status)}</td>
    </tr>)}
    <tr style={{fontWeight:600}}>
     <td colSpan={3}>เฉลี่ย {hist.length} เดือน</td>
     <td style={{textAlign:'right'}}>{fmt(avg('wUnits'))}</td>
     <td style={{textAlign:'right'}}>{fmt(avg('eUnits'))}</td>
     <td style={{textAlign:'right'}}>{fmt(Math.round(hist.reduce((s,b)=>s+(+b.total||0),0)/hist.length))}</td>
     <td/>
    </tr>
    </tbody></table>
   </div>)}
  <div className="row" style={{marginTop:10}}>
   <button className="btn" onClick={onEdit}>✏️ แก้ไขห้อง</button>
   <button className="btn gray" onClick={onClose}>ปิด</button>
  </div>
 </Modal>;
}

// ===== กล่องจัดการไฟล์สัญญา (อัปโหลด/ดู/ดาวน์โหลด — PDF/JPG/PNG) =====
function ContractFileModal({c,t,onClose,refresh}){
 const [,bump]=useState(0);
 const u=Repo.get('units',c.unitId)||{};
 const files=Repo.list('files',x=>x.contractId===c.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const dl=fl=>{const a=document.createElement('a');a.href=fl.data;a.download=fl.name||'contract';document.body.appendChild(a);a.click();a.remove()};
 const up=async e=>{
  for(const file of [...e.target.files]){
   let data=await fileToDataUrl(file); data=await shrinkImage(data);
   if(data.length>4200000){alert('"'+file.name+'" ใหญ่เกิน ~3MB — ข้ามไฟล์นี้ (สแกน/ถ่ายความละเอียดต่ำลง)');continue}
   try{Repo.create('files',{contractId:c.id,name:file.name,data,date:today()})}catch(err){break}
  }
  e.target.value='';bump(x=>x+1);
 };
 return <Modal title={'📄 สัญญา — ห้อง '+(u.code||'')+(c.no?(' · เลขที่ '+c.no):'')} onClose={onClose}>
  <div className="mut" style={{marginBottom:10}}>ผู้เช่า {t?t.name:'-'} · เก็บไฟล์ PDF / JPG / PNG</div>
  {files.length===0
   ?<div className="mut" style={{marginBottom:12}}>ยังไม่มีไฟล์สัญญา — กด "อัปโหลด" ด้านล่างเพื่อเพิ่ม</div>

function Meters({refresh}){
 const [month,setMonth]=useMonth();
 const [util,setUtil]=useUtil(); // water | elec (จำข้ามการ refresh)
 const isW=util==='water';
 const units=unitsOfCur().filter(u=>u.hasWaterMeter||u.hasElecMeter).sort((a,b)=>a.code.localeCompare(b.code));
 const prevM=addMonth(month,-1);
 const readings=Repo.list('meter_readings',r=>r.month===month);
 const prevR=Repo.list('meter_readings',r=>r.month===prevM);
 const [draft,setDraft]=useState({});
 const savedCount=readings.filter(r=>(isW?r.wEnd:r.eEnd)>0).length;
 const [editing,setEditing]=useState(false);
 const [editPrev,setEditPrev]=useState(false); // ปลดล็อกช่อง "เดือนก่อน" (เฉพาะตอนกดแก้ไข)
 const [review,setReview]=useState(null); // ผลสอบทาน (รายการห้องผิดปกติ) รอผู้ใช้ยืนยัน
 // เปลี่ยนเดือน/ชนิดมิเตอร์ → รีเซ็ต draft และตั้งโหมด: มีข้อมูลแล้ว=ล็อกดู, ยังไม่มี=แก้ไข
 React.useEffect(()=>{setDraft({});setEditing(savedCount===0);setEditPrev(false);setReview(null);},[month,util]);
 const get=(uid)=>{
  const ex=readings.find(r=>r.unitId===uid);
  const pv=prevR.find(r=>r.unitId===uid);
  const d=draft[uid]||{};
  return{ex,pv,
   wStart:d.wStart??(ex?ex.wStart:(pv?pv.wEnd:'')),wEnd:d.wEnd??(ex?ex.wEnd:''),
   eStart:d.eStart??(ex?ex.eStart:(pv?pv.eEnd:'')),eEnd:d.eEnd??(ex?ex.eEnd:'')}};
 const set=(uid,g,k,v)=>setDraft({...draft,[uid]:{...(draft[uid]||{wStart:g.wStart,wEnd:g.wEnd,eStart:g.eStart,eEnd:g.eEnd}),[k]:v}});
 const commit=()=>{let n=0;
  units.forEach(u=>{const g=get(u.id);
   const end=isW?g.wEnd:g.eEnd; if(end===''||end==null)return;
   const base=g.ex?{...g.ex}:{unitId:u.id,month,wStart:0,wEnd:0,eStart:0,eEnd:0,by:'เจ้าของ',note:''};
   if(isW){base.wStart=+g.wStart||0;base.wEnd=+g.wEnd||0}else{base.eStart=+g.eStart||0;base.eEnd=+g.eEnd||0}
   base.readDate=today();
   g.ex?Repo.update('meter_readings',g.ex.id,base):Repo.create('meter_readings',base);n++});
  setDraft({});setEditing(false);setEditPrev(false);setReview(null);alert('บันทึก'+(isW?'ค่าน้ำ':'ค่าไฟ')+' '+n+' ห้อง เดือน '+monthTH(month));refresh()};
 // ค่าเฉลี่ยหน่วยที่ใช้ 3 เดือนย้อนหลัง (เฉพาะชนิดที่กำลังจด) — null ถ้าไม่มีประวัติ
 const avgUse=(uid)=>{
  const h=Repo.list('meter_readings',r=>r.unitId===uid&&r.month<month).sort((a,b)=>b.month.localeCompare(a.month)).slice(0,3);
  const us=h.map(r=>usage(isW?r.wStart:r.eStart,isW?r.wEnd:r.eEnd)).filter(v=>v>0);
  return us.length?us.reduce((s,v)=>s+v,0)/us.length:null};
 // สอบทานรายห้อง → คืน {code,rs} ถ้าผิดปกติ, null ถ้าปกติ
 const checkUnit=(u)=>{const g=get(u.id);const end=isW?g.wEnd:g.eEnd;if(end===''||end==null)return null;
   const S=+(isW?g.wStart:g.eStart)||0,E=+end||0;const use=usage(S,E);const avg=avgUse(u.id);const rs=[];
   if(E<S)rs.push('เลขเดือนนี้ '+fmt(E)+' น้อยกว่าเดือนก่อน '+fmt(S)+' (มิเตอร์อาจวนรอบ หรือกรอกสลับกัน)');
   if(avg!=null&&avg>0){
    if(use>avg*1.5)rs.push('ใช้ '+use+' หน่วย — สูงกว่าค่าเฉลี่ย 3 เดือน ('+avg.toFixed(1)+' หน่วย) เกิน 50%');
    else if(use<avg*0.3)rs.push('ใช้ '+use+' หน่วย — ต่ำกว่า 30% ของค่าเฉลี่ย 3 เดือน ('+avg.toFixed(1)+' หน่วย)')}
   // ดักค่าที่พิมพ์เกินจริง แม้ไม่มีประวัติ 3 เดือนให้เทียบ (เช่น ห้องที่เดือนก่อนใช้ 0)
   if(use>9999&&!rs.some(x=>x.indexOf('สูงกว่าค่าเฉลี่ย')>=0))rs.push('ใช้ '+use+' หน่วย — มากผิดปกติ (เกินหนึ่งรอบมิเตอร์ 4 หลัก น่าจะพิมพ์เลขเกิน)');
   return rs.length?{code:u.code,rs}:null};
 const checkAnomalies=()=>units.map(checkUnit).filter(Boolean);
 // เตือนทันทีที่กรอกห้องนั้นเสร็จ (ออกจากช่อง) — จะได้แก้ตรงนั้นก่อนไปห้องอื่น

 const uc=isW?'#12489e':'#7b2d8e', utxt=isW?'wtxt':'etxt', un=isW?'น้ำ':'ไฟ';

 const tstyle={'--g1':shade(uc,-0.34),'--g2':uc,'--g3':shade(uc,0.16)};

     const st=isW?g.wStart:g.eStart, en=isW?g.wEnd:g.eEnd;

     const isSaved=isW?(g.ex&&g.ex.wEnd>0):(g.ex&&g.ex.eEnd>0);

     return <tr key={u.id}><td><span className="plink" style={{background:pillBg,color:pillTx,borderColor:pillBd}} title="ดูประวัติการใช้ห้องนี้" onClick={()=>setHist({unit:u})}>{u.code}{isSaved&&' ✓'}</span></td>

       {!g.pv&&editing&&<div style={{fontSize:10,color:'#c96e20',lineHeight:1.3}}>⚠ ไม่มีเดือนก่อน</div>}</td>
      <td>{editing

       : <span className={utxt} style={{fontSize:15}}>{en===''||en==null?'—':fmt(en)}</span>}</td>
      <td className="r">{use===''?<span className="mut">—</span>:<span className={'ubadge '+(isW?'w':'e')}>{use}</span>}</td></tr>})}
   </tbody></table></div></div>
  {hist&&<MeterHistory unit={hist.unit} util={util} onClose={()=>setHist(null)}/>}
  {review&&<Modal title={review.mode==='cell'

   <div className="mut" style={{marginBottom:10}}>{review.mode==='cell'
     ? 'ค่าห้องนี้ดูผิดปกติ ตรวจสอบอีกครั้ง — ถ้าถูกต้องกด "ใช้ค่านี้" ถ้าพิมพ์ผิดกด "แก้ไขใหม่" แล้วพิมพ์ใหม่ได้เลย'

// ===== ประวัติการใช้น้ำ/ไฟ (รายห้อง + ทั้งอาคาร) =====
function MeterHistory({unit,util,onClose}){
 const units=unitsOfCur().filter(u=>u.hasWaterMeter||u.hasElecMeter).sort((a,b)=>a.code.localeCompare(b.code));
 const uidSet=new Set(units.map(u=>u.id));
 const allR=Repo.list('meter_readings',r=>uidSet.has(r.unitId));
 const months=[...new Set(allR.map(r=>r.month))].sort(); // เก่า→ใหม่
 if(unit){ // ── ประวัติรายห้อง (น้ำ+ไฟ ทุกเดือน) ──
  const rows=months.map(m=>allR.find(x=>x.unitId===unit.id&&x.month===m)).filter(Boolean).reverse();
  return <Modal title={'📊 ประวัติการใช้ — ห้อง '+unit.code} onClose={onClose}>
   {rows.length===0?<div className="mut">ยังไม่มีประวัติการจดมิเตอร์ของห้องนี้</div>:
   <div className="scrollx"><table className="t">
    <thead><tr><th>เดือน</th>
     <th className="r wtxt">💧 น้ำ (หน่วย)</th><th className="r">น้ำ ต้น→ปลาย</th>
     <th className="r etxt">⚡ ไฟ (หน่วย)</th><th className="r">ไฟ ต้น→ปลาย</th></tr></thead>
    <tbody>{rows.map(r=><tr key={r.month}>
     <td><b>{monthTH(r.month)}</b></td>
     <td className="r wtxt"><b>{usage(r.wStart,r.wEnd)}</b></td>
     <td className="r"><span className="mut">{r.wStart}→{r.wEnd}</span></td>
     <td className="r etxt"><b>{usage(r.eStart,r.eEnd)}</b></td>
     <td className="r"><span className="mut">{r.eStart}→{r.eEnd}</span></td></tr>)}</tbody></table></div>}
   <div className="mut" style={{marginTop:10}}>หน่วยที่ใช้ = ปลาย − ต้น (คิดมิเตอร์วนรอบให้แล้ว)</div>
  </Modal>;
 }
 // ── ประวัติทั้งอาคาร: ทุกห้อง × เดือนล่าสุด (สูงสุด 8 เดือน) ของชนิดที่เลือก ──
 const isW=util==='water', utxt=isW?'wtxt':'etxt';
 const showM=months.slice(-8);
 return <Modal title={'📊 ประวัติการใช้'+(isW?'น้ำ (กปภ.)':'ไฟ (กฟภ.)')} onClose={onClose}>
  <div className="mut" style={{marginBottom:8}}>หน่วยที่ใช้ต่อเดือน · ทุกห้องในอาคารนี้ · สลับน้ำ/ไฟจากปุ่มในหน้าจดมิเตอร์</div>
  {showM.length===0?<div className="mut">ยังไม่มีประวัติ</div>:
  <div className="scrollx"><table className="t">
   <thead><tr><th>ห้อง</th>{showM.map(m=><th key={m} className={'r '+utxt}>{monthTH(m)}</th>)}</tr></thead>
   <tbody>{units.map(u=><tr key={u.id}><td><b>{u.code}</b></td>
    {showM.map(m=>{const r=allR.find(x=>x.unitId===u.id&&x.month===m);
     const v=r?usage(isW?r.wStart:r.eStart,isW?r.wEnd:r.eEnd):null;
     return <td key={m} className={'r '+utxt}>{v==null?<span className="mut">-</span>:v}</td>})}</tr>)}
   <tr style={{borderTop:'2px solid var(--g3)'}}><td><b>รวม</b></td>
    {showM.map(m=>{let s=0;units.forEach(u=>{const r=allR.find(x=>x.unitId===u.id&&x.month===m);if(r)s+=usage(isW?r.wStart:r.eStart,isW?r.wEnd:r.eEnd)});
     return <td key={m} className={'r '+utxt}><b>{s||'-'}</b></td>})}</tr></tbody></table></div>}
 </Modal>;
}
// ===== บิล =====
function Bills({refresh,go}){
 const [month,setMonth]=useMonth();
 const [view,setView]=useState(null); // ป๊อปอัพดูรายละเอียดห้อง (ไม่เปลี่ยน TAB)
 const [payU,setPayU]=useState(null); // ฟอร์มกรอกวันที่จ่าย (เหมือนหน้าห้อง)
 const utilM=addMonth(month,-1);
 const bills=Repo.list('bills',b=>b.rentMonth===month&&(Repo.get('units',b.unitId)||{}).propertyId===curPid()).sort((a,b)=>{
  const ua=Repo.get('units',a.unitId)||{code:''},ub=Repo.get('units',b.unitId)||{code:''};return ua.code.localeCompare(ub.code)});
 const [pay,setPay]=useState(null);
 const rates=curRates();
 // เลือกคอลัมน์ที่จะแสดงในตารางบิล (จำไว้ใน localStorage)
 const COLDEFS=[{k:'rent',l:'ค่าเช่า'},{k:'svc',l:'ค่าบริการ'},{k:'water',l:'ค่าน้ำ'},{k:'elec',l:'ค่าไฟ'},{k:'net',l:'ค่าเน็ต'},{k:'area',l:'ค่าพื้นที่'},{k:'status',l:'วันที่จ่าย'}];
 const defCols={rent:true,svc:true,water:true,elec:true,net:true,area:true,status:true};
 const [cols,setCols]=useState(()=>{try{return{...defCols,...JSON.parse(localStorage.getItem('rentalapp_billcols')||'{}')}}catch(e){return defCols}});
 const toggleCol=k=>{const n={...cols,[k]:!cols[k]};setCols(n);try{localStorage.setItem('rentalapp_billcols',JSON.stringify(n))}catch(e){}};
 const nCol=1+COLDEFS.filter(c=>cols[c.k]).length+2; // ห้อง + คอลัมน์ที่เลือก + รวม + ปุ่ม
 const genBills=()=>{
  const units=unitsOfCur().filter(u=>isOccupied(u.id));
  const readings=Repo.list('meter_readings',r=>r.month===utilM);
  let made=0,skipNoRead=0,skipHave=0;
  units.forEach(u=>{
   if(bills.find(b=>b.unitId===u.id)){skipHave++;return}
   const rd=readings.find(r=>r.unitId===u.id);
   if(!rd){skipNoRead++;return}
   const c=activeContract(u.id);
   const wU=usage(rd.wStart,rd.wEnd),eU=usage(rd.eStart,rd.eEnd);
   const ct=c?c.type:(u.contractType||'old');
   const items=calcBill({rent:c?c.rent:u.rent,service:c?c.service:u.service,svcX:u.serviceExtra||0,trash:u.trash||0,othF:u.otherFee||0,disc:u.discount||0,wUnits:wU,eUnits:eU,rates,contractType:ct,internet:u.internet||0,area:u.areaFee||0});
   Repo.create('bills',{unitId:u.id,contractId:c?c.id:null,tenantId:c?c.tenantId:null,rentMonth:month,utilMonth:utilM,issueDate:today(),
    wStart:rd.wStart,wEnd:rd.wEnd,wUnits:wU,eStart:rd.eStart,eEnd:rd.eEnd,eUnits:eU,items,total:items.total,
    status:'ค้างชำระ',paidDate:null,payMethod:null,receiptNo:'',ratesSnapshot:{...rates},note:''});made++});
  alert('ออกบิล '+made+' ห้อง'+(skipNoRead?' / ข้าม '+skipNoRead+' ห้อง (ยังไม่จดมิเตอร์ '+monthTH(utilM)+')':'')+(skipHave?' / มีบิลแล้ว '+skipHave:''));refresh()};
 const doPay=()=>{
  const rno=pay.receiptNo||('R'+month.replace('-','')+'-'+String(pay.bill.id).padStart(4,'0'));
  Repo.update('bills',pay.bill.id,{status:'ชำระแล้ว',paidDate:pay.date,payMethod:pay.method,receiptNo:rno});
  Repo.create('payments',{billId:pay.bill.id,amount:pay.bill.total,date:pay.date,method:pay.method,ref:pay.ref||'',receiptNo:rno});
  setPay(null);refresh()};
 const unpaidSum=bills.filter(b=>b.status==='ค้างชำระ').reduce((s,b)=>s+b.total,0);
 return <div>
  <div className="card"><div className="row">
   <F l="เดือนค่าเช่า (บิล)"><input type="month" value={month} onChange={e=>setMonth(e.target.value)}/></F>
   <button className="btn" onClick={genBills}>🧾 ออกบิลเดือนนี้</button>
   <button className="btn line" onClick={()=>printReceipts(bills)}>🖨️ พิมพ์ใบเสร็จทั้งหมด</button></div>
   <div className="mut">บิล {monthTH(month)} = ค่าเช่า {monthTH(month)} + ค่าน้ำ/ไฟ {monthTH(utilM)} · รวมค้างชำระ {fmt(unpaidSum)} บาท</div>
   <div className="row" style={{marginTop:10,gap:'6px 14px',flexWrap:'wrap',alignItems:'center'}}>
    <b style={{fontSize:12,color:'var(--mut)'}}>แสดงคอลัมน์:</b>
    {COLDEFS.map(c=><label key={c.k} style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:13,cursor:'pointer',margin:0}}>
     <input type="checkbox" checked={!!cols[c.k]} onChange={()=>toggleCol(c.k)} style={{width:'auto',margin:0}}/>{c.l}</label>)}</div></div>
  <div className="card"><div className="scrollx"><table className="t">
   <thead><tr><th>ห้อง</th><th className="r">รวม</th>{cols.status&&<th>วันที่จ่าย</th>}
    {cols.rent&&<th className="r">ค่าเช่า</th>}{cols.svc&&<th className="r">ค่าบริการ</th>}
    {cols.water&&<th className="r">ค่าน้ำ</th>}{cols.elec&&<th className="r">ค่าไฟ</th>}
    {cols.net&&<th className="r">ค่าเน็ต</th>}{cols.area&&<th className="r">ค่าพื้นที่</th>}
    <th></th></tr></thead>
   <tbody>{bills.length===0&&<tr><td colSpan={nCol} className="mut">ยังไม่มีบิลเดือนนี้ — กด "ออกบิลเดือนนี้" (ต้องจดมิเตอร์ {monthTH(utilM)} ก่อน)</td></tr>}
   {bills.map(b=>{const u=Repo.get('units',b.unitId)||{};const it=b.items;
    const svc=(it.service||0)+(it.svcX||0)+(it.trash||0)+(it.othF||0)+(it.disc||0)+(it.cfSum||0)+(it.other||0);
    const w=(it.wH||0)+(it.wI||0)+(it.wJ||0)+(it.wK||0), e=(it.eL||0)+(it.eM||0)+(it.eN||0)+(it.eO||0);
    const z=v=>v?fmt(v):'-';
    return <tr key={b.id}><td><span className="plink" title="ดูรายละเอียดห้อง" onClick={()=>setView(u)}>{u.code}</span></td>
    <td className="r tot">{z(b.total)}</td>
    {cols.status&&<td><span className="tap" title="กดเพื่อกรอกวันที่จ่าย" onClick={()=>setPayU({u,b,date:b.paidDate||today()})}>
     {b.status==='ค้างชำระ'?<span className="tag r">ค้างจ่าย</span>:<span className="tag g">{b.paidDate?dateTH(b.paidDate):'จ่ายแล้ว'}</span>}</span></td>}
    {cols.rent&&<td className="r">{z(it.rent)}</td>}
    {cols.svc&&<td className="r">{z(svc)}</td>}
    {cols.water&&<td className="r">{z(w)}</td>}
    {cols.elec&&<td className="r">{z(e)}</td>}
    {cols.net&&<td className="r">{z(it.internet)}</td>}
    {cols.area&&<td className="r">{z(it.area)}</td>}
    <td><div className="row" style={{gap:4,flexWrap:'nowrap'}}>
     {b.status==='ค้างชำระ'&&<button className="btn sm" onClick={()=>setPay({bill:b,date:today(),method:'โอน',ref:'',receiptNo:''})}>รับเงิน</button>}
     <button className="btn sm line" onClick={()=>printReceipts([b])}>ใบเสร็จ</button>
     <button className="btn sm red" onClick={()=>{if(confirm('ลบบิลห้อง '+u.code+'?')){Repo.remove('bills',b.id);refresh()}}}>ลบ</button>
    </div></td></tr>})}
  </tbody></table></div></div>
  {view&&<RoomViewModal unit={view} onClose={()=>setView(null)} onEdit={()=>{OPEN_UNIT=view.id;setView(null);go('units')}}/>}
  {payU&&(()=>{const{u,b}=payU;
   return <Modal title={'วันที่จ่าย — ห้อง '+u.code} onClose={()=>setPayU(null)}>
    <div className="mut" style={{marginBottom:10}}>บิลเดือน {monthTH(b.rentMonth)} · ยอด {fmt(b.total)} บาท · สถานะปัจจุบัน: {b.status}{b.paidDate?' ('+dateTH(b.paidDate)+')':''}</div>
    <F l="วันที่จ่าย"><input type="date" value={payU.date} onChange={e=>setPayU({...payU,date:e.target.value})}/></F>
    <div className="row">
     <button className="btn" onClick={()=>{
      const rno=b.receiptNo||('R'+b.rentMonth.replace('-','')+'-'+String(b.id).padStart(4,'0'));
      Repo.update('bills',b.id,{status:'ชำระแล้ว',paidDate:payU.date,payMethod:b.payMethod||'โอน',receiptNo:rno});
      const ps=Repo.list('payments',p=>p.billId===b.id);
      if(ps.length===0)Repo.create('payments',{billId:b.id,amount:b.total,date:payU.date,method:'โอน',ref:'',receiptNo:rno});
      else ps.forEach(p=>Repo.update('payments',p.id,{date:payU.date}));
      setPayU(null);refresh()}}>✓ จ่ายแล้ว วันที่ที่เลือก</button>
     <button className="btn warn" onClick={()=>{
      Repo.update('bills',b.id,{status:'ค้างชำระ',paidDate:null,payMethod:null});
      Repo.list('payments',p=>p.billId===b.id).forEach(p=>Repo.remove('payments',p.id));
      setPayU(null);refresh()}}>ค้างจ่าย (ยังไม่จ่าย)</button>
     <button className="btn gray" onClick={()=>setPayU(null)}>ปิด</button>
    </div>
   </Modal>})()}
  {pay&&<Modal title={'รับชำระ ห้อง '+(Repo.get('units',pay.bill.unitId)||{}).code+' — '+fmt(pay.bill.total)+' บาท'} onClose={()=>setPay(null)}>
   <div className="grid2">

    <F l="ช่องทาง"><select value={pay.method} onChange={e=>setPay({...pay,method:e.target.value})}><option>โอน</option><option>เงินสด</option></select></F>
    <F l="อ้างอิง/สลิป"><input value={pay.ref} onChange={e=>setPay({...pay,ref:e.target.value})}/></F>
    <F l="เลขที่ใบเสร็จ (เว้นให้ระบบรัน)"><input value={pay.receiptNo} onChange={e=>setPay({...pay,receiptNo:e.target.value})}/></F>
   </div>
   <button className="btn" onClick={doPay}>✅ ยืนยันรับเงิน</button>
  </Modal>}
 </div>;
}

  line('ความเสี่ยงจัดเก็บไฟ 10%',it.eM)+line('กำไรไฟ 10%',it.eN)+line('ค่าดำเนินการไฟฟ้า',it.eO)+
  line('อินเทอร์เน็ต',it.internet)+line('ค่าขอใช้พื้นที่ด้านข้าง',it.area)+line('อื่นๆ',it.other)+
  ((it.cf||[]).map(x=>line(x.name,x.amount)).join(''))+
  '<tr><td><b>รวมทั้งสิ้น</b></td><td class="r"><b>'+fmt(b.total)+'</b></td></tr></table>'+
  '<div style="margin-top:8px;display:flex;justify-content:space-between"><span>สถานะ: '+b.status+(b.paidDate?' ('+dateTH(b.paidDate)+' / '+b.payMethod+')':'')+'</span>'+

const LEDGER_KEYS=['washer','depositIn','insuranceIn','otherIncome','water','elec','maid','repair','care','trash','depositRefund','insuranceRefund','otherExpense','otherDebt'];
function Expenses({refresh}){
 const [month,setMonth]=useMonth();
 const pid=curPid();
 const loadF=()=>{const r=Repo.list('ledger',x=>x.propertyId===pid&&x.month===month)[0]||{};
  const o={};LEDGER_KEYS.forEach(k=>o[k]=(r[k]!=null&&r[k]!==0)?r[k]:'');return o};
 const [f,setF]=useState(loadF);
 React.useEffect(()=>{setF(loadF())},[month,pid]);
 const num=k=>+f[k]||0;
 // ── ค่าที่ดึงมาอัตโนมัติ ──
 const uset=new Set(unitsOfCur().map(u=>u.id));
 const rentIncome=Repo.list('payments',x=>x.date&&x.date.slice(0,7)===month&&uset.has((Repo.get('bills',x.billId)||{}).unitId)).reduce((s,x)=>s+x.amount,0);
 const rentDebt=Repo.list('bills',b=>b.rentMonth===month&&b.status==='ค้างชำระ'&&uset.has(b.unitId)).reduce((s,b)=>s+b.total,0);
 const totalIncome=rentIncome+num('washer')+num('depositIn')+num('insuranceIn')+num('otherIncome');
 const totalExpense=num('water')+num('elec')+num('maid')+num('repair')+num('care')+num('trash')+num('depositRefund')+num('insuranceRefund')+num('otherExpense');
 const net=totalIncome-totalExpense;
 const totalDebt=rentDebt+num('otherDebt');
 const save=()=>{const data={propertyId:pid,month};LEDGER_KEYS.forEach(k=>data[k]=+f[k]||0);
  const ex=Repo.list('ledger',x=>x.propertyId===pid&&x.month===month)[0];
  ex?Repo.update('ledger',ex.id,data):Repo.create('ledger',data);
  alert('บันทึกรับ/จ่าย เดือน '+monthTH(month)+' แล้ว');refresh()};
 const IN=(k,l)=><div className="step" style={{padding:'7px 0',alignItems:'center'}}><div style={{flex:1}}>{l}</div>
   <div style={{width:150}}><input type="number" placeholder="0" style={{textAlign:'right'}} value={f[k]} onChange={e=>setF({...f,[k]:e.target.value})}/></div></div>;
 const RO=(l,v,note)=><div className="step" style={{padding:'7px 0',alignItems:'center'}}><div style={{flex:1}}>{l} <span className="mut">{note}</span></div>
   <div style={{width:150,textAlign:'right'}}><b>{fmt(v)}</b> <span className="mut">🔒</span></div></div>;
 const TOT=(l,v,color)=><div className="step" style={{padding:'9px 0',borderTop:'2px solid var(--g3)',borderBottom:0}}><div style={{flex:1}}><b style={{fontSize:15}}>{l}</b></div>
   <div style={{width:150,textAlign:'right'}}><b style={{color:color||'var(--g1)',fontSize:17,fontFamily:'Prompt,sans-serif'}}>{fmt(v)}</b></div></div>;
 return <div>
  <div className="card"><div className="row" style={{justifyContent:'space-between'}}>
   <F l="เดือน"><input type="month" value={month} onChange={e=>setMonth(e.target.value)}/></F>
   <button className="btn" onClick={save}>💾 บันทึก</button></div>
   <div className="mut">สรุปรับ/จ่ายของ {curProp().shortName||curProp().name} เดือน {monthTHfull(month)} · ช่อง 🔒 ดึงจากระบบอัตโนมัติ · ช่องอื่นกรอกเองแล้วกดบันทึก</div></div>
  <div className="card"><h2>💰 รายรับ</h2>
   {RO('รายได้ค่าเช่ารวม',rentIncome,'(เก็บได้จริงเดือนนี้)')}
   {IN('washer','รายได้เครื่องซักผ้า')}
   {IN('depositIn','ค่ามัดจำ')}
   {IN('insuranceIn','ค่าประกันห้อง')}
   {IN('otherIncome','รายได้อื่น ๆ')}
   {TOT('รวมรายรับ',totalIncome,'var(--ok)')}</div>
  <div className="card"><h2>💸 รายจ่าย</h2>
   {IN('water','ค่าน้ำจ่ายจริง')}
   {IN('elec','ค่าไฟจ่ายจริง')}
   {IN('maid','ค่าแม่บ้าน')}
   {IN('repair','ค่าซ่อมแซม')}
   {IN('care','ค่าดูแล')}
   {IN('trash','ค่าขยะ')}
   {IN('depositRefund','เงินคืนมัดจำ')}
   {IN('insuranceRefund','เงินคืนค่าประกันห้อง')}
   {IN('otherExpense','ค่าอื่น ๆ')}
   {TOT('รวมรายจ่าย',totalExpense,'var(--red)')}</div>
  <div className="card curp2">{TOT('คงเหลือ (รายรับ − รายจ่าย)',net,net<0?'var(--red)':'var(--ok)')}</div>
  <div className="card"><h2>📕 หนี้สิน</h2>
   {RO('หนี้ค่าเช่า',rentDebt,'(บิลค้างชำระเดือนนี้)')}
   {IN('otherDebt','หนี้อื่น ๆ')}
   {TOT('รวมหนี้สิน',totalDebt,'var(--warn)')}</div>
 </div>;
}

  </div>
  <div className="card"><h2>เขตอันตราย</h2>
   <button className="btn red" onClick={async()=>{if(confirm('ล้างข้อมูลทั้งหมดบนคลาวด์ (ทุกเครื่องจะว่างเปล่า)? การกระทำนี้ย้อนกลับไม่ได้ (ควรส่งออก backup ก่อน)')&&confirm('ยืนยันอีกครั้ง: ลบข้อมูลทุกอาคาร ทุกห้อง ทุกบิล ถาวร?')){Repo.reset();await forceSync();location.reload()}}}>♻️ ล้างข้อมูลทั้งหมด (เริ่มระบบเปล่า)</button>

// จุดแสดงสถานะบันทึกขึ้นคลาวด์ (เขียว=บันทึกแล้ว เหลือง=กำลังบันทึก แดง=ผิดพลาด แตะเพื่อลองใหม่)
function SyncDot(){
 const [s,setS]=useState(SYNC.state);
 useEffect(()=>{const f=()=>setS(SYNC.state);window.addEventListener('syncstate',f);return()=>window.removeEventListener('syncstate',f)},[]);
 const c=s==='error'?'#e03131':s==='saving'?'#f5a623':'#3bb273';
 const t=s==='error'?'บันทึกขึ้นคลาวด์ไม่สำเร็จ — แตะเพื่อลองใหม่':s==='saving'?'กำลังบันทึกขึ้นคลาวด์…':'ข้อมูลบันทึกบนคลาวด์แล้ว';
 return <button className="theme-btn" title={t} onClick={()=>syncNow()}>
  <span style={{display:'inline-block',width:10,height:10,borderRadius:'50%',background:c,boxShadow:'0 0 4px '+c}}/></button>;
}

    ?<div className="sub">ภาพรวมทุกอาคาร</div>
    :<select className="prop-sel" value={curPid()} onChange={e=>{setCurPid(e.target.value);refresh()}}>
      {Repo.list('properties').map(p=><option key={p.id} value={p.id}>{propIcon(p.type)} {p.shortName||p.name}</option>)}
     </select>}</div>
   <div className="row" style={{gap:0,flexWrap:'nowrap'}}>
    <div className="date-chip">{dateTH(today())}</div>
    <SyncDot/>
    <button className="theme-btn sim-btn" title="จำลองหน้าจอมือถือ" onClick={()=>setSim(true)}>📱</button>
    <button className="theme-btn" title="สลับโหมดกลางวัน/กลางคืน" onClick={()=>{
     const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
     document.documentElement.dataset.theme=t;localStorage.setItem('rentalapp_theme',t);setTheme(t);
    }}>{theme==='dark'?'☀️':'🌙'}</button>
   </div></header>
  <main key={tick}>{P[page]}</main>
  <nav className="bottom">{PAGES.map(p=><button key={p.k} className={page===p.k?'on':''} onClick={()=>setPage(p.k)}>
   <span className="ic">{p.ic}</span>{p.l}</button>)}</nav>
  {sim&&<div className="sim-bg" onClick={e=>{if(e.target===e.currentTarget){setSim(false);refresh()}}}>
   <div>
    <div className="row" style={{justifyContent:'space-between',marginBottom:8}}>
     <b style={{color:'#fff',fontFamily:'Prompt,sans-serif'}}>📱 ตัวอย่างบนมือถือ — ใช้งานได้จริง ข้อมูลชุดเดียวกัน</b>
     <button className="btn sm gray" onClick={()=>{setSim(false);refresh()}}>✕ ปิด</button>
    </div>
    <div className="phone"><iframe src={location.href.split('#')[0]} title="mobile-preview"/></div>
   </div></div>}
 </div>;
}
// ===== Login (เฟส 2) =====
function Login(){
 const [email,setEmail]=useState('');const [pw,setPw]=useState('');
 const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
 const go=async e=>{e.preventDefault();setBusy(true);setErr('');
  const {error}=await supa.auth.signInWithPassword({email:email.trim(),password:pw});
  if(error){setBusy(false);setErr(error.message.indexOf('Invalid')>=0?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':(error.message.indexOf('confirm')>=0?'อีเมลยังไม่ถูกยืนยันในระบบ':error.message))}
  else location.reload()};
 return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
  <form className="card" style={{maxWidth:380,width:'100%'}} onSubmit={go}>
   <h2 style={{textAlign:'center'}}>🏢 ระบบบริหารการเช่า</h2>
   <div className="mut" style={{textAlign:'center',marginBottom:14}}>เข้าสู่ระบบเพื่อใช้งาน — ข้อมูลของคุณอยู่บนคลาวด์อย่างปลอดภัย</div>
   <label>อีเมล<input type="email" value={email} onChange={e=>setEmail(e.target.value)} autoFocus required/></label>
   <label>รหัสผ่าน<input type="password" value={pw} onChange={e=>setPw(e.target.value)} required/></label>
   {err&&<div style={{color:'var(--red)',margin:'8px 0'}}>⚠️ {err}</div>}
   <button className="btn" style={{width:'100%',marginTop:12}} disabled={busy}>{busy?'กำลังเข้าสู่ระบบ…':'เข้าสู่ระบบ'}</button>
  </form></div>;
}
// ===== Bootstrap: เช็คล็อกอิน → โหลดข้อมูลจากคลาวด์ → เปิดแอป =====
const _root=ReactDOM.createRoot(document.getElementById('root'));
async function boot(){
 try{
  const {data:{session}}=await supa.auth.getSession();
  if(!session){_root.render(<Login/>);return}
  _root.render(<div style={{padding:'60px 20px',textAlign:'center',fontFamily:'Prompt,sans-serif'}}>⏳ กำลังโหลดข้อมูลจากคลาวด์…</div>);
  _db=await fetchDB();
  takeSnap();
  if(!_db.properties.length){
   // คลาวด์ยังว่าง — ถ้าเครื่องนี้มีข้อมูลเฟส 1 เดิม เสนอย้ายขึ้นคลาวด์ครั้งเดียว
   let local=null;try{local=JSON.parse(localStorage.getItem(DB_KEY))}catch(e){}
   if(local&&local.properties&&local.properties.length&&confirm('คลาวด์ยังว่าง แต่พบข้อมูลเดิมในเครื่องนี้ ('+local.properties.length+' อาคาร, '+(local.units||[]).length+' ห้อง)\n\nอัปโหลดข้อมูลเดิมขึ้นคลาวด์เลยหรือไม่?')){
    _db=local;
   }else{seedMinimal(_db)}
  }
  fixup(_db);
  persist(); // ดันส่วนต่าง (ข้อมูลที่ย้าย/ฟิลด์ที่เติม) ขึ้นคลาวด์
  _root.render(<App/>);
 }catch(e){
  console.error(e);
  _root.render(<div style={{padding:'60px 20px',textAlign:'center',fontFamily:'Prompt,sans-serif'}}>
   ❌ โหลดข้อมูลไม่สำเร็จ: {String((e&&e.message)||e)}<br/>
   <button className="btn" style={{marginTop:14}} onClick={()=>location.reload()}>ลองใหม่</button></div>);
 }
}
boot();
</script>
</body>
